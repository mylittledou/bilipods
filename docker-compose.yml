services:
  bilipods:
    image: ghcr.io/${GITHUB_REPOSITORY:-mylittledou/bilipods}:latest
    container_name: bilipods
    restart: unless-stopped
    ports:
      - "8000:8000"
    # network_mode: "host" # 如需与宿主机本地代理/服务直连，可取消注释并删除上方 ports
    volumes:
      - ./downloads:/app/downloads
      - ./cookies.json:/app/cookies.json
      - ./subscriptions.json:/app/subscriptions.json
      - ./data:/app/data
    environment:
      - PYTHONUNBUFFERED=1
      # - BARK_KEY=your_bark_key_here
      # - BARK_SERVER=https://api.day.app
