version: '3.8'

services:
  bilipods:
    build: .
    image: ghcr.io/${GITHUB_REPOSITORY:-user/bilipods}:latest
    container_name: bilipods
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./downloads:/app/downloads
      - ./cookies.json:/app/cookies.json
    environment:
      - PYTHONUNBUFFERED=1
